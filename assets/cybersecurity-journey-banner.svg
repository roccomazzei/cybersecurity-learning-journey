<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380" role="img" aria-labelledby="title desc">
  <title id="title">Cybersecurity Learning Journey</title>
  <desc id="desc">Premium dark SOC Analyst portfolio banner with centered glass panel and subtle cyber network details.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="45%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101b2b" stop-opacity=".94"/>
      <stop offset="55%" stop-color="#0c1624" stop-opacity=".90"/>
      <stop offset="100%" stop-color="#0a1320" stop-opacity=".94"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0" cy=".5" r=".8">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="1" cy=".5" r=".8">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#17314a" stroke-width="1" opacity=".16"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity=".45"/>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="380" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="380" rx="30" fill="url(#grid)"/>
  <rect width="520" height="380" fill="url(#glowLeft)"/>
  <rect x="880" width="520" height="380" fill="url(#glowRight)"/>

  <!-- subtle outer corner marks -->
  <g stroke="#29445e" stroke-width="2" opacity=".55" fill="none">
    <path d="M48 86 V48 H86"/>
    <path d="M1314 48 H1352 V86"/>
    <path d="M48 294 V332 H86"/>
    <path d="M1314 332 H1352 V294"/>
  </g>

  <!-- balanced side network accents -->
  <g opacity=".34">
    <g fill="none" stroke="#38bdf8" stroke-width="1.3">
      <path d="M40 190 H104 L142 152 H196"/>
      <path d="M40 224 H118 L154 260 H210"/>
      <path d="M1190 152 H1244 L1282 190 H1360"/>
      <path d="M1176 260 H1232 L1268 224 H1360"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="104" cy="190" r="3.5"/>
      <circle cx="142" cy="152" r="3.5"/>
      <circle cx="118" cy="224" r="3.5"/>
      <circle cx="154" cy="260" r="3.5"/>
      <circle cx="1244" cy="152" r="3.5"/>
      <circle cx="1282" cy="190" r="3.5"/>
      <circle cx="1232" cy="260" r="3.5"/>
      <circle cx="1268" cy="224" r="3.5"/>
    </g>
  </g>

  <!-- premium glass panel -->
  <g filter="url(#shadow)">
    <rect x="150" y="60" width="1100" height="260" rx="26" fill="url(#panel)" stroke="#22364a" stroke-width="1.4"/>
    <rect x="151" y="61" width="1098" height="258" rx="25" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </g>

  <!-- top kicker -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="548" y="84" width="304" height="34" rx="17" fill="#0b2130" stroke="#1f4f67" stroke-width="1"/>
    <circle cx="573" cy="101" r="4.5" fill="#34d399" filter="url(#softGlow)"/>
    <text x="700" y="107" text-anchor="middle" fill="#9fdff5" font-size="14" font-weight="700" letter-spacing="2.1">
      SOC ANALYST PORTFOLIO
    </text>
  </g>

  <!-- title -->
  <text x="700" y="174"
        text-anchor="middle"
        fill="#f8fafc"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="54"
        font-weight="750"
        letter-spacing=".1">
    Cybersecurity Learning Journey
  </text>

  <!-- subtitle -->
  <text x="700" y="216"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="20"
        font-weight="400">
    Hands-on labs · TryHackMe · Detection-minded security learning
  </text>

  <!-- status pills -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
    <rect x="451" y="244" width="232" height="40" rx="20" fill="#0b2231" stroke="#1f5169"/>
    <text x="567" y="269" text-anchor="middle" fill="#7dd3fc">CYBER SECURITY 101</text>

    <rect x="703" y="244" width="246" height="40" rx="20" fill="#0c241f" stroke="#1d5947"/>
    <text x="826" y="269" text-anchor="middle" fill="#86efac">NEXT · SOC LEVEL 1</text>
  </g>

  <!-- premium accent -->
  <rect x="500" y="304" width="400" height="2.5" rx="1.25" fill="url(#accent)" opacity=".95"/>

  <!-- micro labels -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b" letter-spacing="1.4">
    <text x="178" y="344">NETWORK · WEB · CRYPTO · DEFENSE</text>
    <text x="1222" y="344" text-anchor="end">LEARN · BUILD · INVESTIGATE</text>
  </g>
</svg>