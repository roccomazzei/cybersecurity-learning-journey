<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Cybersecurity Learning Journey</title>
  <desc id="desc">Centered dark cybersecurity portfolio banner for a SOC Analyst learning path.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="50%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#07131d"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#1e3a4d" stroke-width="1" opacity=".28"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="360" rx="28" fill="url(#grid)"/>

  <!-- balanced decorative network -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.6" opacity=".24">
    <path d="M95 82 L220 122 L315 72 L405 118"/>
    <path d="M95 278 L220 238 L315 288 L405 242"/>
    <path d="M1305 82 L1180 122 L1085 72 L995 118"/>
    <path d="M1305 278 L1180 238 L1085 288 L995 242"/>
  </g>

  <g fill="#22d3ee" opacity=".5">
    <circle cx="95" cy="82" r="4"/><circle cx="220" cy="122" r="5"/><circle cx="315" cy="72" r="4"/><circle cx="405" cy="118" r="5"/>
    <circle cx="95" cy="278" r="4"/><circle cx="220" cy="238" r="5"/><circle cx="315" cy="288" r="4"/><circle cx="405" cy="242" r="5"/>
    <circle cx="1305" cy="82" r="4"/><circle cx="1180" cy="122" r="5"/><circle cx="1085" cy="72" r="4"/><circle cx="995" cy="118" r="5"/>
    <circle cx="1305" cy="278" r="4"/><circle cx="1180" cy="238" r="5"/><circle cx="1085" cy="288" r="4"/><circle cx="995" cy="242" r="5"/>
  </g>

  <!-- centered shield mark -->
  <g transform="translate(700 70)" filter="url(#glow)">
    <path d="M0 -28 L28 -18 V4 C28 24 15 39 0 48 C-15 39 -28 24 -28 4 V-18 Z"
          fill="#0d2232" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M-10 2 L-2 10 L13 -8" fill="none" stroke="#67e8f9" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- centered typography -->
  <text x="700" y="154"
        text-anchor="middle"
        fill="#f1f5f9"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="52"
        font-weight="700"
        letter-spacing=".2">
    Cybersecurity Learning Journey
  </text>

  <text x="700" y="198"
        text-anchor="middle"
        fill="#94a3b8"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        font-size="23"
        font-weight="400">
    Hands-on security portfolio · TryHackMe · SOC Analyst path
  </text>

  <!-- centered status pills -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">
    <rect x="486" y="229" width="230" height="44" rx="22"
          fill="#0e2637" stroke="#22d3ee" stroke-opacity=".65"/>
    <text x="601" y="257" text-anchor="middle" fill="#67e8f9">CYBER SECURITY 101</text>

    <rect x="736" y="229" width="178" height="44" rx="22"
          fill="#102a25" stroke="#34d399" stroke-opacity=".65"/>
    <text x="825" y="257" text-anchor="middle" fill="#6ee7b7">SOC ANALYST</text>
  </g>

  <!-- bottom accent -->
  <rect x="530" y="309" width="340" height="3" rx="1.5" fill="url(#accent)" opacity=".8"/>
</svg>